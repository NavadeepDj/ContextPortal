[project]
name = "contextportal-backend"
version = "0.1.0"
description = "ContextPortal — Authenticated context proxy for AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "playwright>=1.62.0",
    "readability-lxml>=0.8.4.1",
    "markdownify>=1.2.3",
    "mcp[cli]>=2.1.1",
]

[project.scripts]
contextportal = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
